<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/uibk.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
	</head>
	<body>
		
		<div class="reveal">
			<div class="slides">
				<section data-markdown="slides/intro.md" data-separator="^\n\n\n"
					data-separator-vertical="^\n\n" data-separator-notes="^Note:"></section>
				<section data-markdown="slides/dsr.md" data-separator="^\n\n\n"
					data-separator-vertical="^\n\n" data-separator-notes="^Note:"></section>
			</div>
		</div>

		<!-- Footer -->
		<div class="slide-footer">
			<div class= "footer-item">
				<img src="assets/images/universitaet-innsbruck-logo-cmyk-farbe.jpg" alt="University Logo" style="height: 50px; position: absolute; left: 0px; bottom: 0px;">
			</div>
			<div class="footer-item" id="footer-date">10.10.2025</div>
    		<div class="footer-item">BIM Augmentation with a DSL Ecosystem</div>
    		<div class="footer-item">Emanuele Goldin</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script src="plugin/zoom/zoom.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealZoom ]
			});
		</script>
	</body>
</html>
